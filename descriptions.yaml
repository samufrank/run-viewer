# Hand-maintained, read by `benchadapt publish` when it regenerates index.html.
# One entry per run id. Fields:
#   description: one line saying what the run established, or what it is still on the index for
#   equivalence: one line in a fixed shape, filled from the harness logs, never from memory:
#     <verdict>; sim <n> <cycles|vectors> on <module>.<outputs>, <m> mismatches; LEC <proven>/<points>[ (unproven on <signals>)]; <testbench>, <model file>
#     verdict: equivalent (0 mismatches and every LEC point proven) | inconclusive (0 mismatches, LEC short or not run)
#              | not equivalent (any mismatch, whatever LEC said) | not checked
#     sim: count and unit as the testbench reports them; <module>.<outputs> is the module the harness
#          compares and its ports; <m> mismatches = checked cycles (or vectors) on which the named output
#          differed from the original on the same cycle, per output when more than one is listed. A rewrite
#          that is right a cycle late is not equivalent; say so in words in the mismatch clause
#          ("505 mismatches; 0 with the original delayed one cycle") so the failure is legible.
#     LEC: proven over total $equiv points from equiv_status; "LEC not run" when it was not; unproven signals listed
#     harness: the testbench file (benchadapt verify/equiv/) and the behavioral model file (verify/models/,
#              with its stage variant where more than one exists). Run: verify/equiv/run_equiv.sh <run id>;
#              its logs land in the run directory under equiv/
# A run with no entry still appears in the index, with blank description and equivalence
# cells. Keep lines short; the index shows them verbatim.
#
# Convention: the models column already names the roster, so a description names a model only
# where the run's point is a comparison between models. Runs that are otherwise alike are
# distinguished by something that actually happened in them.

